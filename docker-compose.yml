version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bililite-backend
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/test.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bililite-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  db_data:
